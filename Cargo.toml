[package]
name = "sigmaos_package_manager"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SigmaOS package-manager component inspired by Linux Mint / Omarchy / Arch Linux."

[lib]
name = "sigmaos_package_manager"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
